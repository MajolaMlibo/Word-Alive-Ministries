name: Release regression checks
on: pull_request
permissions:
  contents: read
jobs:
  regression:
    if: github.event.repository.private == false || vars.ENABLE_RELEASE_CHECKS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run test:release
